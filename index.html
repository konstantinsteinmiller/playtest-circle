<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Testing Circle</title>
    <meta name="description" content="Quid pro quo playtesting — game devs test each other's games, record the session and answer real questions. Open source." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0B10" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta property="og:title" content="Play Testing Circle" />
    <meta property="og:description" content="Quid pro quo playtesting for game devs." />
    <meta property="og:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <script>
      // Pre-paint theme so there's no flash. Dark is the default.
      ;(function () {
        var pref = 'dark'
        try {
          pref = localStorage.getItem('ptc-theme') || 'dark'
        } catch (e) {}
        var dark = pref === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : pref !== 'light'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
